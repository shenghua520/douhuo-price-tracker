<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>代发价监控 · 已选品</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="header-inner">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <span></span>
          </div>
          <div class="brand-copy">
            <h1>代发价监控</h1>
            <p>斗货已选品 · 每日同步</p>
          </div>
        </div>

        <div class="header-side">
          <div class="header-meta">
            <div class="hm">
              <span class="hm-k">更新时间</span>
              <span class="hm-v" id="updated-at">—</span>
            </div>
            <div class="hm">
              <span class="hm-k">在售商品</span>
              <span class="hm-v" id="goods-count">—</span>
            </div>
          </div>
          <div class="header-actions">
            <button type="button" class="btn btn-danger-soft" id="btn-alerts">
              涨价
              <span class="count" id="alert-count">0</span>
            </button>
            <button type="button" class="btn" id="btn-export">导出 CSV</button>
            <button type="button" class="btn btn-ghost" id="btn-reload" title="重新加载">刷新</button>
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <div id="banner" class="notice hidden" role="alert"></div>
      <div id="alert-banner" class="notice notice-up hidden" role="status"></div>

      <section class="metrics" aria-label="今日概览">
        <article class="metric">
          <span class="metric-label">在售商品</span>
          <span class="metric-value" id="stat-total">—</span>
          <span class="metric-note">当前选品池</span>
        </article>
        <article class="metric metric-up">
          <span class="metric-label">较上次涨价</span>
          <span class="metric-value" id="stat-up">—</span>
          <span class="metric-note">需要关注</span>
        </article>
        <article class="metric metric-down">
          <span class="metric-label">较上次降价</span>
          <span class="metric-value" id="stat-down">—</span>
          <span class="metric-note">成本下降</span>
        </article>
        <article class="metric">
          <span class="metric-label">最大涨幅</span>
          <span class="metric-value metric-value-sm" id="stat-max-up">—</span>
          <span class="metric-note">单商品最高</span>
        </article>
      </section>

      <section class="filters" aria-label="筛选">
        <div class="filters-row">
          <label class="field search-field">
            <span class="sr-only">搜索商品</span>
            <svg class="field-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input id="search-input" type="search" placeholder="搜索商品名、SPU、SKU…" autocomplete="off" />
          </label>

          <label class="field select-field">
            <span class="sr-only">渠道</span>
            <select id="channel-select">
              <option value="">全部渠道</option>
            </select>
          </label>

          <div class="segmented" role="group" aria-label="涨跌筛选">
            <button type="button" class="seg active" data-filter="all">全部</button>
            <button type="button" class="seg" data-filter="up">涨价</button>
            <button type="button" class="seg" data-filter="down">降价</button>
          </div>

          <p class="result-count" id="list-summary">加载中…</p>
        </div>
      </section>

      <section class="board" aria-label="商品列表">
        <div class="board-head" aria-hidden="true">
          <span class="col-product">商品</span>
          <span class="col-price">现价</span>
          <span class="col-delta">较上次</span>
          <span class="col-sku">规格</span>
          <span class="col-date">日期</span>
        </div>

        <div id="loading" class="state">
          <div class="spinner" aria-hidden="true"></div>
          <p>正在加载价格数据…</p>
        </div>
        <div id="empty" class="state hidden">
          <p class="state-title">没有匹配的商品</p>
          <p class="state-desc">换个关键词，或切回「全部」。</p>
        </div>
        <div id="error-box" class="state hidden">
          <p class="state-title">数据加载失败</p>
          <p class="state-desc" id="error-msg">请确认已运行采集脚本，并通过静态服务打开页面。</p>
          <button type="button" class="btn btn-primary" id="btn-retry">重试</button>
        </div>
        <div id="goods-list" class="rows" role="list"></div>
      </section>

      <p class="footer-note">单位：元 · 涨跌对比上次采集 · 每日 09:10 自动更新</p>
    </main>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <div id="drawer-backdrop" class="backdrop hidden" hidden></div>
  <aside id="drawer" class="drawer hidden" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <header class="drawer-head">
      <div class="drawer-titles">
        <p class="drawer-spu" id="drawer-spu">—</p>
        <h2 id="drawer-title">商品详情</h2>
      </div>
      <button type="button" class="icon-btn" id="btn-close-drawer" aria-label="关闭">×</button>
    </header>
    <div class="drawer-meta" id="drawer-meta"></div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
</body>
</html>
