<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>已选品代发价监控</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>已选品代发价监控</h1>
          <p class="brand-sub">斗货商城 · 每日采集 · 趋势可追溯</p>
        </div>
      </div>
      <div class="topbar-meta">
        <div class="meta-item">
          <span class="meta-label">更新</span>
          <span id="updated-at" class="meta-value">—</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">商品</span>
          <span id="goods-count" class="meta-value">—</span>
        </div>
        <button id="btn-alerts" type="button" class="btn btn-alert" title="涨价提醒">
          涨价 <span id="alert-count" class="alert-badge">0</span>
        </button>
        <button id="btn-export" type="button" class="btn btn-ghost">导出 CSV</button>
        <button id="btn-reload" type="button" class="btn btn-ghost">重新加载</button>
      </div>
    </div>
  </header>

  <div id="banner" class="banner hidden" role="alert"></div>
  <div id="alert-banner" class="alert-banner hidden" role="status"></div>

  <main class="layout">
    <section class="stats" id="stats" aria-label="概览">
      <div class="stat-card">
        <span class="stat-label">在售商品</span>
        <span class="stat-value" id="stat-total">—</span>
      </div>
      <div class="stat-card stat-up">
        <span class="stat-label">较上次涨价</span>
        <span class="stat-value" id="stat-up">—</span>
      </div>
      <div class="stat-card stat-down">
        <span class="stat-label">较上次降价</span>
        <span class="stat-value" id="stat-down">—</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">最大涨幅</span>
        <span class="stat-value" id="stat-max-up">—</span>
      </div>
    </section>

    <section class="toolbar" aria-label="筛选">
      <label class="search">
        <span class="sr-only">搜索商品</span>
        <input id="search-input" type="search" placeholder="搜索商品名 / SPU / SKU…" autocomplete="off" />
      </label>
      <label class="select-wrap">
        <span class="sr-only">渠道筛选</span>
        <select id="channel-select" aria-label="渠道">
          <option value="">全部渠道</option>
        </select>
      </label>
      <div class="filters" role="group" aria-label="快捷筛选">
        <button type="button" class="chip active" data-filter="all">全部</button>
        <button type="button" class="chip" data-filter="up">有涨价</button>
        <button type="button" data-filter="down" class="chip">有降价</button>
      </div>
      <div class="toolbar-hint" id="list-summary">加载中…</div>
    </section>

    <section class="list-panel" aria-label="商品列表">
      <div id="loading" class="state-box">
        <div class="spinner" aria-hidden="true"></div>
        <p>正在加载价格数据…</p>
      </div>
      <div id="empty" class="state-box hidden">
        <p class="state-title">没有匹配的商品</p>
        <p class="state-desc">换个关键词，或点「全部」清空筛选。</p>
      </div>
      <div id="error-box" class="state-box hidden">
        <p class="state-title">数据加载失败</p>
        <p class="state-desc" id="error-msg">请确认已运行采集脚本，并通过静态服务打开页面。</p>
        <button type="button" class="btn btn-primary" id="btn-retry">重试</button>
      </div>
      <div id="goods-list" class="goods-list" role="list"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>

  <div id="drawer-backdrop" class="drawer-backdrop hidden" hidden></div>
  <aside id="drawer" class="drawer hidden" aria-hidden="true" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <div>
        <p class="drawer-eyebrow" id="drawer-spu">—</p>
        <h2 id="drawer-title">商品详情</h2>
      </div>
      <button type="button" class="btn btn-icon" id="btn-close-drawer" aria-label="关闭">×</button>
    </div>
    <div class="drawer-meta" id="drawer-meta"></div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
</body>
</html>
