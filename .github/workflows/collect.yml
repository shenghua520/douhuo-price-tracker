name: daily-price-collect

on:
  schedule:
    # Try several morning slots (UTC). Beijing = UTC+8.
    # GitHub public-repo cron is best-effort and may skip/delay.
    - cron: "10 0 * * *"   # 08:10 CST
    - cron: "40 1 * * *"   # 09:40 CST
    - cron: "10 3 * * *"   # 11:10 CST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect prices
        env:
          DOUHUO_APP_ID: ${{ secrets.DOUHUO_APP_ID }}
          DOUHUO_APP_SECRET: ${{ secrets.DOUHUO_APP_SECRET }}
          DOUHUO_MOBILE: ${{ secrets.DOUHUO_MOBILE }}
        run: node scripts/collect.js

      - name: Commit and push GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/products.json data/history.json docs/data/products.json docs/data/history.json
          if git diff --staged --quiet; then
            echo "No data change"
            echo "CHANGED=0" >> "$GITHUB_ENV"
          else
            git commit -m "data: daily price snapshot"
            git push origin HEAD:main
            echo "CHANGED=1" >> "$GITHUB_ENV"
          fi

      - name: Push snapshot to Gitee (mirror)
        if: env.CHANGED == '1'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: shenghua520/douhuo-price-tracker
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN not set, skip gitee push"
            exit 0
          fi
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://shenghua520:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          git fetch gitee main || true
          git push gitee HEAD:main || git push gitee HEAD:main --force-with-lease
          git remote remove gitee
          echo "gitee mirror done"
