name: daily-price-collect

on:
  schedule:
    # UTC 01:10 ≈ 北京时间 09:10（GitHub cron 为 UTC）
    - cron: "10 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect prices
        env:
          DOUHUO_APP_ID: ${{ secrets.DOUHUO_APP_ID }}
          DOUHUO_APP_SECRET: ${{ secrets.DOUHUO_APP_SECRET }}
          DOUHUO_MOBILE: ${{ secrets.DOUHUO_MOBILE }}
        run: node scripts/collect.js

      - name: Commit to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/history.json site/data/products.json site/data/history.json
          if git diff --staged --quiet; then
            echo "No data change"
            echo "CHANGED=0" >> "$GITHUB_ENV"
          else
            git commit -m "data: daily price snapshot"
            git push
            echo "CHANGED=1" >> "$GITHUB_ENV"
          fi

      - name: Push snapshot to Gitee (for Gitee Pages)
        if: env.CHANGED == '1'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: shenghua520/douhuo-price-tracker
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN not set, skip gitee push"
            exit 0
          fi
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://shenghua520:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          git push gitee HEAD:main
          git remote remove gitee
          echo "pushed to gitee"
