name: price-sync

on:
  schedule:
    # 每天 09:17 北京时间（UTC+8）= 01:17 UTC，刻意避开整点（整点最容易被 GitHub 延迟/丢弃）
    # 注意：GitHub 的 schedule 实测不稳定——本仓库曾用 */10 连跑 8 小时、0 次触发。
    # 因此它只作为「兜底」；页面上的刷新按钮（手动 dispatch）才是主要触发方式。
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只跑一个采价任务；手动触发时不打断进行中的任务
concurrency:
  group: price-sync
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect
        env:
          DOUHUO_APP_ID: ${{ secrets.DOUHUO_APP_ID }}
          DOUHUO_APP_SECRET: ${{ secrets.DOUHUO_APP_SECRET }}
          DOUHUO_MOBILE: ${{ secrets.DOUHUO_MOBILE }}
        run: node scripts/collect.js

      - name: Verify snapshot
        run: node scripts/selftest.js

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/history.json docs/data/products.json docs/data/history.json
          if git diff --staged --quiet; then
            echo "No data change"
            exit 0
          fi
          git commit -m "data: price snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
