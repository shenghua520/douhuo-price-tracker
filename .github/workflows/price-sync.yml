name: price-sync

on:
  schedule:
    # !! 临时测试用：每 10 分钟一次，用来验证 GitHub 的 schedule 到底会不会触发
    # !! 验证完请改回下面这行（每天 09:10 北京时间，避开整点）：
    #    - cron: "10 1 * * *"
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只跑一个采价任务；手动触发时不打断进行中的任务
concurrency:
  group: price-sync
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect
        env:
          DOUHUO_APP_ID: ${{ secrets.DOUHUO_APP_ID }}
          DOUHUO_APP_SECRET: ${{ secrets.DOUHUO_APP_SECRET }}
          DOUHUO_MOBILE: ${{ secrets.DOUHUO_MOBILE }}
        run: node scripts/collect.js

      - name: Verify snapshot
        run: node scripts/selftest.js

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/history.json docs/data/products.json docs/data/history.json
          if git diff --staged --quiet; then
            echo "No data change"
            exit 0
          fi
          git commit -m "data: price snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
