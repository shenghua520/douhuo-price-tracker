name: price-sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect
        env:
          DOUHUO_APP_ID: ${{ secrets.DOUHUO_APP_ID }}
          DOUHUO_APP_SECRET: ${{ secrets.DOUHUO_APP_SECRET }}
          DOUHUO_MOBILE: ${{ secrets.DOUHUO_MOBILE }}
        run: node scripts/collect.js

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/history.json docs/data/products.json docs/data/history.json
          if git diff --staged --quiet; then
            echo "No data change"
            exit 0
          fi
          git commit -m "data: price snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
