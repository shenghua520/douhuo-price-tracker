name: price-sync

on:
  schedule:
    # 每天 09:17 北京时间（UTC+8）= 01:17 UTC，刻意避开整点（整点最容易被 GitHub 延迟/丢弃）
    # 注意：GitHub 的 schedule 实测不稳定——本仓库曾用 */10 连跑 8 小时、0 次触发。
    # 因此它只作为「兜底」；页面上的刷新按钮（手动 dispatch）才是主要触发方式。
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只跑一个采价任务；手动触发时不打断进行中的任务
concurrency:
  group: price-sync
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect
        env:
          DOUHUO_APP_ID: ${{ secrets.DOUHUO_APP_ID }}
          DOUHUO_APP_SECRET: ${{ secrets.DOUHUO_APP_SECRET }}
          DOUHUO_MOBILE: ${{ secrets.DOUHUO_MOBILE }}
        run: node scripts/collect.js

      - name: Verify snapshot
        run: node scripts/selftest.js

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES="data/products.json data/history.json docs/data/products.json docs/data/history.json"
          if git diff --quiet -- $FILES; then
            echo "No data change"
            exit 0
          fi

          # 留一份本次采集结果，后面要反复重放到「最新的远端」之上
          mkdir -p /tmp/ours/data /tmp/ours/docs-data
          cp data/products.json data/history.json /tmp/ours/data/
          cp docs/data/products.json docs/data/history.json /tmp/ours/docs-data/

          # 并发兜底：JSON 是逐行合并的，两个 run 同时提交必然在 updated_at / 价格行上冲突
          # （实测过一次 `git pull --rebase` 报 CONFLICT in docs/data/products.json）。
          # 所以每轮都对齐到最新远端，再把本次采集结果重放上去，直到 push 成功。
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            cp /tmp/ours/data/*.json data/
            cp /tmp/ours/docs-data/*.json docs/data/
            git add $FILES
            if git diff --staged --quiet; then
              echo "远端已含相同数据，无需提交"
              exit 0
            fi
            git commit -m "data: price snapshot"
            if git push origin HEAD:main; then
              echo "push 成功（第 ${i} 次尝试）"
              exit 0
            fi
            echo "push 失败，${i} 次后重试…" >&2
            sleep 5
          done

          echo "push 连续失败，放弃" >&2
          exit 1
