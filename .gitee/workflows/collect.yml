# Gitee Go — 每日采集已选品代发价
# 需在仓库「设置 → 管理 → 变量/密钥」配置：
#   DOUHUO_APP_ID / DOUHUO_APP_SECRET / DOUHUO_MOBILE
# 说明：Gitee Go 可能需要企业版/套餐支持；若不可用见 README「本地定时」备选方案。

name: collect-daily-price

on:
  schedule:
    # 每天 09:10（UTC+8 由 Gitee 侧解释；若为 UTC 请按 01:10 UTC 换算调整）
    - cron: "10 1 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect prices
        env:
          DOUHUO_APP_ID: ${{ secrets.DOUHUO_APP_ID }}
          DOUHUO_APP_SECRET: ${{ secrets.DOUHUO_APP_SECRET }}
          DOUHUO_MOBILE: ${{ secrets.DOUHUO_MOBILE }}
        run: node scripts/collect.js

      - name: Commit data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@local"
          git add data/products.json data/history.json site/data/products.json site/data/history.json
          if git diff --staged --quiet; then
            echo "No data change"
          else
            git commit -m "data: daily price snapshot"
            git push
          fi
